{% for field in form %}
  {% if field.is_hidden %}
    {{ field }}
  {% elif field.name == "DELETE" %}
    {{ field.as_hidden }}
  {% else %}
    <div class="field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<span class="muted small">{{ field.help_text }}</span>{% endif %}
      {% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}
    </div>
  {% endif %}
{% endfor %}
