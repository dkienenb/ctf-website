services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctf}
      POSTGRES_USER: ${POSTGRES_USER:-ctf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctf}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctf} -d ${POSTGRES_DB:-ctf}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    volumes:
      - attachments:/app/private_attachments
      - templates:/app/private_templates
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,app,caddy}
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-0}
      POSTGRES_DB: ${POSTGRES_DB:-ctf}
      POSTGRES_USER: ${POSTGRES_USER:-ctf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctf}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      GUACAMOLE_JSON_SECRET: ${GUACAMOLE_JSON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  lab-tick:
    build: .
    command: ["scheduler"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctf}
      POSTGRES_USER: ${POSTGRES_USER:-ctf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctf}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8090:80"
      - "172.20.201.125:8090:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app

  guacamole:
    image: guacamole/guacamole:1.6.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      WEBAPP_CONTEXT: ROOT      # REQUIRED, no default: the guacd that terminates desktop sessions is
      # the per-workhorse guacd (agent/guacd-install.sh), co-located with the
      # lab VMs. Guacamole 1.6.0 has no per-connection guacd routing — grants
      # cannot redirect it — so this is deployment-wide (see .env.example).
      # A compose-local guacd cannot reach the guests' VNC (host loopback),
      # so none is defined here.
      GUACD_HOSTNAME: ${GUACD_HOSTNAME:?set GUACD_HOSTNAME in .env — the workhorse guacd address}
      POSTGRESQL_HOSTNAME: db
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD:-guacpw}
      JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET:-}
      LOG_LEVEL: info
    volumes:
      - ./guac/extensions:/root/.guacamole/extensions:ro

# --- Path A: one Guacamole instance per workhorse -----------------------------
# Guacamole 1.6.0 has no per-connection guacd routing, so each workhorse's
# desktops are served by its own instance, pinned to that host's guacd via
# GUACD_HOSTNAME. For each NEW workhorse: copy this block, set the service
# name alias (guac-<slug>), GUACD_HOSTNAME to that host's management IP, and
# WEBAPP_CONTEXT to its route path (a UNIQUE path — the Caddy route and the
# portal's GUACAMOLE_INSTANCE_PATHS entry must match). See
# agent/ADD-A-WORKHORSE.md §Desktop streaming.
#
#  guacamole-<slug>:
#    image: guacamole/guacamole:1.6.0
#    depends_on:
#      db:
#        condition: service_healthy
#    environment:
#      WEBAPP_CONTEXT: /guacamole/<slug>/
#      GUACD_HOSTNAME: <that workhorse's management IP>
#      POSTGRESQL_HOSTNAME: db
#      POSTGRESQL_DATABASE: guacamole_db
#      POSTGRESQL_USERNAME: guacamole
#      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD:-guacpw}
#      JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET:-}
#      LOG_LEVEL: info
#    volumes:
#      - ./guac/extensions:/root/.guacamole/extensions:ro


volumes:
  pgdata:
  attachments:
  templates:
